    # Flange (link5) -> FINGERTIP offset, SOLVED 2026-07-30 from gripper mesh
    # geometry. This was previously [0,0,0], so FK reported the wrist flange and
    # every planned pose was ~80mm short along the approach axis.
    #
    # Not solvable from camera data: adding L to FK and subtracting it from
    # gripper_T_camera leaves every hand-eye observation identical, so it is a
    # gauge freedom. Broken here with an EXTERNAL constraint - the gripper's own
    # STL meshes.
    #
    # Chain: link6_left_joint_1 -> _joint_2 (parallel four-bar, counter-rotating
    # about x) from the third-party gripper URDF, then the link6_*_2 mesh extent
    # along +z. Official Yahboom ships no gripper model at all; the official arm
    # URDF stops at link5. Fingertip distance from the link5 origin:
    #     jaw +45 deg (widest open)  80.0 mm   <- approach configuration, used here
    #     jaw   0 deg              100.1 mm
    #     jaw -45 deg (closed)     106.4 mm
    #
    # Direction is tool +Z: at the verified observation pose tool +Z is
    # [+0.264, +0.060, -0.963] in the base frame, i.e. pointing down at the table,
    # matching the URDF's finger extent along link5 +z.
    #
    # INDEPENDENT CHECK: at the observation pose the flange sits at base
    # z = +0.1051 and the calibrated table is at z = +0.004. The closed-jaw
    # L = 106.4mm puts the tip at -1.4mm relative to the table - i.e. just
    # touching. That is why the abandoned table-touch calibration measured only
    # 17.5mm of available travel: the tip was already at the table.
    tool_offset_xyz_m: [0.0, 0.0, 0.080]
    tool_offset_rpy_deg: [0.0, 0.0, 0.0]
